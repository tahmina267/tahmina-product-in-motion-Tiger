    <path d="M118 211C214 261 426 261 522 211"/>
    <path d="M159 151C242 193 398 193 481 151"/>
    <path d="M100 373C190 322 450 322 540 373"/>
    <path d="M118 429C214 379 426 379 522 429"/>
    <path d="M159 489C242 447 398 447 481 489"/>
  </g>

  <g fill="url(#land-print)">
    <path d="M157 212L190 198L226 209L244 237L270 260L267 286L247 307L253 338L231 385L211 362L190 345L164 343L151 315L143 277Z"/>
    <path d="M337 167L365 151L400 157L419 177L415 207L445 232L454 257L435 279L410 290L401 326L389 356L369 397L350 370L347 335L354 306L331 283L311 248L316 210Z"/>
    <path d="M278 173L291 165L302 172L296 185L282 187Z"/>
